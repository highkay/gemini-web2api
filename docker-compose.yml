services:
  gemini-web2api:
    image: ghcr.1ms.run/highkay/gemini-web2api:main
    container_name: gemini-web2api
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.json:/app/config.json
    networks:
      - default
      - warp-plus
    restart: always

networks:
  warp-plus:
    external: true
    name: warp-plus_default
