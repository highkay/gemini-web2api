services:
  gemini-web2api:
    image: ghcr.1ms.run/highkay/gemini-web2api:main
    container_name: gemini-web2api
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.json:/app/config.json
      # 粘性池通用模块(热更源码,不动镜像)。挂包目录本身,容器内 `import sticky_pool`
      # 才成立(挂上级目录会变成 namespace package)。
      - /home/admin/sticky_pool/sticky_pool:/app/sticky_pool:ro
      # 筛选状态:CLI(容器内)写、网关读、宿主 /home/admin/clashctl/var/sticky-pool 可见。
      - /home/admin/clashctl/var/sticky-pool:/app/sticky-pool:rw
    networks:
      - default
    restart: always

networks:
  default:
    # 保留固定网络名:容器 IP 落在 192.168.112.0/20,网关代理 URL 依赖它访问宿主 mihomo
    # (socks5://192.168.112.1:7890|7892)。
    name: gemini-web2api_default
    # 曾经的 warp-plus 外部网络已不存在(2026-09-22 `docker network ls` 无任何 warp* 网络),
    # 容器一直只跑在 default 上;保留该引用会让 `docker compose up` 报
    # "network warp-plus_default declared as external, but could not be found" 直接失败。
